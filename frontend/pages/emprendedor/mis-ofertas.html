<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../css/emprendedor/mis-ofertas.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Gestion de Ofertas</title>
</head>

<body>
  <header>
    <img src="../../assets/images/logo.png" alt="logo header higuito" class="header-logo">
  </header>

  <nav>
    <a href="mis-emprendimientos.html">Mis Emprendimientos</a>
    <a href="mis-ofertas.html">Mis Ofertas</a>
    <a href="usuario-info.html">Perfil</a>
    <a href="../index.html">Cerrar Sesión</a>
  </nav>

  <main>
    <div class="SeccionPrincipal">
      <div id="eliminarBanner" class="banner warning">
        <span><i class="fas fa-triangle-exclamation"></i> ¿Está seguro que desea eliminar esta fila?</span>
        <button id="confirmEliminarBtn" class="btnCrud">Sí</button>
        <button id="cancelEliminarBtn" class="btnCrud">No</button>
      </div>
      <div id="registroExitosoBanner" class="bannerSuccess">
        <span><i class="fas fa-circle-check"></i> ¡Oferta Registrada!</span>
      </div>
      <div id="errorRegistroBanner" class="bannerError">
        <i class="fas fa-circle-exclamation"></i>
        <p id="mensaje"></p>
      </div>
      <div class="registroEmprendimientos">
        <div class="botonesCrud">
          <button id="btnRegistrar" class="btnCrud">Nuevo Registro</button>
          <button id="btnEditar" class="btnCrud">Editar</button>
          <button id="btnEliminar" class="btnCrud">Eliminar</button>
        </div>
        <table id="tablaEmprendimientos" class="tabla">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Emprendimiento Asociado</th>
              <th>Vigencia</th>
              <th>Estado</th>
              <th>Descripción</th>
              <th>Imagen/Logo del Producto</th>
            </tr>
          </thead>
          <tbody>
            <tr>
            </tr>
          </tbody>
        </table>
        <div class="btnGuardar">
          <button id="btnEnviarCambios" class="btnCrud">Enviar cambios</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../../js/emprendedor/mis-ofertas.js"></script>
  <footer>
    <p>&copy; 2025 Comunidad Conectada - Todos los derechos reservados</p>
  </footer>

</body>

</html>
