<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../../css/ciudadano/anuncios.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <img src="../../assets/images/logo.png" alt="logo header higuito" class="header-logo">
  </header>
  <nav>
    <a href="../info-general/acerca-de.html">A Cerca</a>
    <a href="anuncios.html">Anuncios</a>
    <a href="panelCiudadanoReportesySugerencias.html">Reportes y Sugerencias</a>

    <a href="ofertas.html">Ofertas y Descuentos</a>
    <a href="../index.html">Cerrar Sesión</a>
  </nav>
  <main>
    <div class="registroAnuncios">
      <div class="botonesCrud">
        <button id="btnRegistrar" class="btnCrud">Registrar Anuncio</button>
        <button id="btnEditar" class="btnCrud">Editar Anuncio</button>
        <button id="btnEliminar" class="btnCrud">Eliminar Anuncio</button>
      </div>
      <table id="tablaAnuncios" class="tabla">
        <thead>
          <tr>
            <th>Usuario</th>
            <th>Contenido</th>
            <th>Fecha y Hora</th>
            <th>Imagen</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>
      <div class="btnGuardar">
        <button id="btnEnviarCambios" class="btnCrud">Guardar cambios</button>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; 2025 Comunidad Conectada - Todos los derechos reservados</p>
  </footer>
  <div id="confirmModal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2>Eliminar anuncio</h2>
      <p>¿Está seguro de que desea eliminar este anuncio?</p>
      <div class="modal-buttons">
        <button id="confirmYes" class="modal-btn">Sí</button>
        <button id="confirmNo" class="modal-btn">No</button>
      </div>
    </div>
  </div>
  <script src="panelCiudadanoAnuncios.js"></script>
</body>

</html>
