<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../../css/administrador/gestion-emprendimientos.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Anuncios</title>
</head>

<body>
  <header>
    <img src="../../assets/images/logo.png" alt="logo header higuito" class="header-logo">
  </header>

  <nav>
    <a href="../info-general/acerca-de.html">A Cerca</a>
    <a href="anuncios.html">Anuncios</a>
    <a href="panelCiudadanoReportesySugerencias.html">Reportes y Sugerencias</a>
    <a href="../info-general/mapa.html">Mapa</a>
    <a href="calendario.html">Calendario</a>
    <a href="../info-general/transporte-publico.html">Transporte</a>
    <a href="ofertas.html">Ofertas y Descuentos</a>
    <a href="../index.html">Cerrar Sesión</a>
  </nav>
  <main>
    <div class="SeccionPrincipal">
      <div id="eliminarBanner" class="banner warning">
        <span><i class="fas fa-triangle-exclamation"></i> ¿Está seguro que desea eliminar esta fila?</span>
        <button id="confirmEliminarBtn" class="btnCrud">Sí</button>
        <button id="cancelEliminarBtn" class="btnCrud">No</button>
      </div>
      <div id="registroExitosoBanner" class="bannerSuccess">
        <span><i class="fas fa-circle-check"></i> ¡Emprendimientos Registrados!</span>
      </div>
      <div id="errorRegistroBanner" class="bannerError">
        <i class="fas fa-circle-exclamation"></i>
        <p id="mensaje"></p>
      </div>
      <div class="registroEmprendimientos">
        <div class="botonesCrud">
          <button id="btnAprobar" class="btnCrud">Aprobar Anuncio</button>
          <button id="btnRechazar" class="btnCrud">Rechazar Anuncio</button>
          <button id="btnRegistrar" class="btnCrud">Registrar Anuncio</button>
          <button id="btnEditar" class="btnCrud">Editar Anuncio</button>
	  <button id="btnEliminar" class="btnCrud">Eliminar Anuncio</button>
        </div>
        <table id="tablaEmprendimientos" class="tabla">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Contenido</th>
              <th>Estado</th>
              <th>Fecha y Hora</th>
            </tr>
          </thead>
          <tbody>
            <tr>
            </tr>
          </tbody>
        </table>
        <div class="btnGuardar">
          <button id="btnEnviarCambios" class="btnCrud">Enviar cambios</button>
        </div>
      </div>
    </div>
  </main>
  <script src="../../js/administrador/gestion-anuncios.js"></script>
  <footer>
    <p>&copy; 2025 Comunidad Conectada - Todos los derechos reservados</p>
  </footer>

</body>

</html>
