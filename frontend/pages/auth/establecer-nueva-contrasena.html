<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña</title>
  <link rel="stylesheet" href="../../css/auth/restablecer-contrasena.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
    <header>
        <div class="header-content"> <img src="../../assets/images/logo.png" alt="logo header higuito" class="header-logo">
        </div>
    </header>


  <div class="contenedor-formulario">
    <h2>Restablecer Contraseña</h2>
    <form class="formulario">
      <label for="nuevaContrasena" class="etiqueta">Nueva contraseña</label>
      <input type="password" id="nuevaContrasena" name="nuevaContrasena" class="campo-entrada" required />

      <label for="confirmarContrasena" class="etiqueta">Confirmar contraseña</label>
      <input type="password" id="confirmarContrasena" name="confirmarContrasena" class="campo-entrada" required />

      <button type="submit" class="boton-envio">Enviar</button>
    </form>
  </div>

    <footer>
        <p>&copy; 2025 Comunidad Conectada - Todos los derechos reservados</p>
    </footer>
</body>

</html>
