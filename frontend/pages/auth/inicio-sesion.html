<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inicio de Sesión</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/auth/inicio-sesion.css" />
</head>

<body>
  <div class="contenedor-inicio-sesion">
    <h2>Inicio de Sesión</h2>
    <form class="formulario-inicio">
      <label for="correo" class="etiqueta">Correo electrónico</label>
      <input type="email" id="correo" name="correo" class="campo-entrada" required />

      <label for="contrasena" class="etiqueta">Contraseña</label>
      <input type="password" id="contrasena" name="contrasena" class="campo-entrada" required />

      <button type="submit" class="boton-envio">Iniciar</button>
    </form>

    <div class="enlaces-inicio">
      <a href="registro.html">¿No tienes cuenta? Regístrate</a>
      <a href="restablecer-contrasena.html">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
</body>

</html>
