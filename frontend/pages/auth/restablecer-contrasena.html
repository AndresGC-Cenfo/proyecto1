<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Contraseña</title>
  <link rel="stylesheet" href="../../css/auth/restablecer-contrasena.css" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&family=Roboto&display=swap" rel="stylesheet">
</head>

<body>
  <div class="contenedor-formulario">
    <h2>Recuperar Contraseña</h2>
    <form class="formulario">
      <label for="correo" class="etiqueta">Correo electrónico</label>
      <input type="email" id="correo" name="correo" class="campo-entrada" required />
      <button type="submit" class="boton-envio">Enviar</button>
    </form>
    <a href="inicio-sesion.html" class="enlace-volver">Volver a iniciar sesión</a>
  </div>
</body>

</html>
